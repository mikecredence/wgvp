name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU stages)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest tests -q

  dry-run:
    name: dry run on the bundled sample (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU stages)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dry run
        run: python -m wgvp dry-run --cpu-only --out ${{ runner.temp }}/wgvp_dryrun
      - name: Bundled offline example (real footage)
        run: |
          python -m wgvp run examples/bundled --cpu-only
          python examples/verify_examples.py --data examples/bundled
      - name: Keep the QC summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-qc
          path: ${{ runner.temp }}/wgvp_dryrun/wgvp_output/QC_SUMMARY.html
          if-no-files-found: ignore
