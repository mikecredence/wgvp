name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU stages)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest tests -q

  dry-run:
    name: full CPU run and the GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU stages)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Install the demo extras (the README's command)
        run: pip install -e ".[demo]"
      - name: Dry run
        run: python -m wgvp dry-run --cpu-only --out "$RUNNER_TEMP/wgvp_dryrun"
      - name: Bundled offline example (real footage), run on a copy so the checkout keeps its lifted outputs
        run: |
          cp -r examples/bundled "$RUNNER_TEMP/bundled"
          python -m wgvp run "$RUNNER_TEMP/bundled" --cpu-only
          python examples/verify_examples.py --data "$RUNNER_TEMP/bundled"
      - name: A display for the GUI and a software OpenGL for the demo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tk libgl1 libglu1-mesa libgl1-mesa-dri libegl1
      - name: A software OpenGL for the demo (Windows, Mesa3D)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
      - name: The demo video, rendered with the stand-in body model
        env:
          WGVP_DEMO: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest tests/test_demo_render.py -q -rs; else python -m pytest tests/test_demo_render.py -q -rs; fi
      - name: The GUI, driven through a scan, a run, a GPU check and a demo
        env:
          WGVP_GUI_SMOKE: "1"
          WGVP_DEMO: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest tests/test_gui_smoke.py -q -rs; else python -m pytest tests/test_gui_smoke.py -q -rs; fi
      - name: Keep the QC summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-qc-${{ matrix.os }}
          path: ${{ runner.temp }}/wgvp_dryrun/wgvp_output/QC_SUMMARY.html
          if-no-files-found: ignore
